# Application Configuration
server.port=8080
spring.application.name=inventario

# Database Configuration (overridable via env vars for production)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/inventario?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# Server Configuration
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Logging Configuration
logging.level.com.inventario.inventory=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.main.allow-circular-references=true