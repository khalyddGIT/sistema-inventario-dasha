# Application Configuration
server.port=8080
spring.application.name=inventario

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventario?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Logging Configuration
logging.level.com.inventario.inventory=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.main.allow-circular-references=true