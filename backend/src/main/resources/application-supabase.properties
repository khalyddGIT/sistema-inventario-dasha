# Supabase PostgreSQL Configuration
server.port=8080
spring.application.name=inventario

# Datasource Configuration (Supabase PostgreSQL)
# Replace YOUR_SUPABASE_DB_PASSWORD with your actual Supabase database password
spring.datasource.url=jdbc:postgresql://db.ztodsqhbjxldkzvqqjep.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.jackson.serialization.fail-on-empty-beans=false
spring.main.allow-circular-references=true
