# Production profile - Railway + Supabase PostgreSQL
# These values come from Railway environment variables

# Database - Supabase PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - PostgreSQL dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=${PORT:8080}

# Disable circular references warning in prod
spring.main.allow-circular-references=true
spring.web.error.include-message=always

# Logging - less verbose in prod
logging.level.com.inventario.inventory=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
